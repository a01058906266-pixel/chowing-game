<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chowing Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial;overflow:hidden}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#18202b,#07090d)}
.card{width:min(92%,420px);padding:24px;border-radius:20px;background:#202733}
h1{margin-top:0}input,button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;margin-top:10px}
input{background:#10151c;color:#fff}button{background:#4caf50;color:white;font-weight:bold}.secondary{background:#3b4656}
.row{display:flex;gap:10px}.row>*{flex:1}.room{margin-top:15px;padding:12px;background:#111923;border-radius:12px;word-break:break-all}
#game{display:none;position:fixed;inset:0;background:#26313a}
.sky{position:absolute;inset:0 0 50%;background:linear-gradient(#6da5d7,#b8d5e8)}
.ground{position:absolute;left:-20%;width:140%;top:50%;bottom:0;background:#39443b;transform:perspective(500px) rotateX(25deg);transform-origin:top}
.wall{position:absolute;left:20%;top:25%;width:60%;height:45%;background:#59646b;border:8px solid #30373b}
.cross{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);z-index:4}
.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:30px;height:2px;top:14px}.cross:after{height:30px;width:2px;left:14px}
#gun{position:absolute;right:8%;bottom:-5px;width:220px;height:180px;z-index:5;transition:.08s}
.barrel{position:absolute;right:0;top:25px;width:145px;height:48px;background:#171a1d;border-radius:8px}
.body{position:absolute;right:45px;top:55px;width:120px;height:70px;background:#292d31;border-radius:10px}
.grip{position:absolute;right:95px;top:105px;width:48px;height:80px;background:#202328;transform:rotate(15deg);border-radius:8px}
.hand{position:absolute;right:80px;top:90px;width:85px;height:45px;background:#c98f70;border-radius:25px}
#flash{position:absolute;right:14%;top:27%;width:90px;height:70px;background:#ffd75a;clip-path:polygon(0 50%,100% 0,70% 50%,100% 100%);display:none;z-index:6}
#hud{position:absolute;top:15px;left:15px;z-index:8;background:#0008;padding:10px;border-radius:10px}
#ammo{position:absolute;right:18px;bottom:20px;z-index:8;font-size:26px;font-weight:bold}
#shoot{position:absolute;right:20px;bottom:85px;width:90px;height:90px;border-radius:50%;background:#d33;z-index:8}
#look{position:absolute;inset:0;z-index:2}
#notice{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#0009;padding:10px;border-radius:10px;z-index:9}
</style></head>
<body>
<div id="menu"><div class="card">
<h1>🔫 Chowing Game</h1><p>1인칭 슈팅 데모</p>
<input id="name" placeholder="닉네임">
<button onclick="createRoom()">방 만들기</button>
<div class="row"><input id="code" placeholder="방 코드"><button class="secondary" onclick="joinRoom()">방 입장</button></div>
<div id="roomInfo" class="room" style="display:none"></div>
<button class="secondary" onclick="copyInvite()">초대 링크 복사</button>
</div></div>
<div id="game">
<div class="sky"></div><div class="ground"></div><div class="wall"></div><div id="look"></div><div class="cross"></div><div id="flash"></div>
<div id="gun"><div class="barrel"></div><div class="body"></div><div class="grip"></div><div class="hand"></div></div>
<div id="hud">방: <span id="roomLabel"></span></div><div id="notice">화면을 드래그해서 시점 이동</div>
<div id="ammo">🔫 12 / 60</div><button id="shoot">발사</button>
</div>
<script>
let room="",ammo=12,angle=0;
const $=id=>document.getElementById(id);
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function createRoom(){room=makeCode();showRoom()}
function joinRoom(){room=($("code").value||"").trim().toUpperCase();if(room)showRoom()}
function showRoom(){const link=location.href.split("?")[0]+"?room="+room;$("roomInfo").style.display="block";$("roomInfo").innerHTML="방 코드: <b>"+room+"</b><br><small>"+link+"</small>";$("roomLabel").textContent=room;history.replaceState(null,"","?room="+room);$("menu").style.display="none";$("game").style.display="block"}
async function copyInvite(){if(!room)createRoom();const link=location.href.split("?")[0]+"?room="+room;try{await navigator.clipboard.writeText(link);alert("초대 링크가 복사되었습니다.")}catch(e){prompt("링크를 복사하세요:",link)}}
function shoot(){if(ammo<=0)return;ammo--;$("ammo").textContent="🔫 "+ammo+" / 60";$("flash").style.display="block";$("gun").style.transform="translateY(18px) rotate(-2deg)";setTimeout(()=>{$("flash").style.display="none";$("gun").style.transform=""},90)}
$("shoot").onclick=shoot;
$("look").addEventListener("pointermove",e=>{if(e.buttons!==1)return;angle+=(e.movementX||0)*.35;$("wall").style.transform="translateX("+(-angle)+"px)"});
$("look").addEventListener("pointerdown",e=>$("look").setPointerCapture(e.pointerId));
document.addEventListener("keydown",e=>{if(e.code==="Space")shoot()});
const p=new URLSearchParams(location.search);if(p.get("room")){room=p.get("room").toUpperCase();showRoom()}
</script></body></html>
